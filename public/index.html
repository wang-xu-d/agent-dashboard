<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0F172A">
<title>Agent Dashboard · 本地 Agent 统一视图</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主内容</a>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></symbol>
  <symbol id="i-cost" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M14 7h7v7"/></symbol>
  <symbol id="i-skills" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></symbol>
  <symbol id="i-mcps" viewBox="0 0 24 24"><path d="M8 3v5M16 3v5M5 8h14v2a7 7 0 0 1-14 0V8zM12 17v4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.4 5.7M20 5v6h-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5h.01"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M12 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM7 9l3 3-3 3M13 15h4"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 15H3L12 4zM12 9v4M12 16h.01"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M3 13h4l2 3h6l2-3h4M5 5h14l2 8v6H3v-6l2-8z"/></symbol>
  <symbol id="i-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/></symbol>
</svg>

<header class="topbar">
  <a class="brand" href="#/overview" aria-label="Agent Dashboard 总览">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.5l8 4.6v8.8l-8 4.6-8-4.6V7.1l8-4.6z"/><path d="M12 11.4l8-4.6M12 11.4v8.6M12 11.4L4 6.8"/></svg>
    </span>
    <span class="brand-text">
      <strong>Agent Dashboard</strong>
      <small>本地 Agent 统一视图 · 只读</small>
    </span>
  </a>

  <div class="topbar-meta" id="topbar-meta" aria-live="polite">
    <span class="meta-item"><span class="dot"></span>正在读取本地数据…</span>
  </div>

  <button class="btn btn-ghost" id="btn-refresh" type="button" title="重新扫描本地日志（增量）">
    <svg class="ico" aria-hidden="true"><use href="#i-refresh"/></svg>
    <span>重新扫描</span>
  </button>
</header>

<div class="shell">
  <nav class="rail" aria-label="视图切换">
    <a class="rail-item" href="#/overview" data-nav="overview">
      <svg class="ico" aria-hidden="true"><use href="#i-overview"/></svg>
      <span class="rail-label">总览</span>
      <span class="rail-badge" data-badge="overview"></span>
    </a>
    <a class="rail-item" href="#/cost" data-nav="cost">
      <svg class="ico" aria-hidden="true"><use href="#i-cost"/></svg>
      <span class="rail-label">模型开销</span>
      <span class="rail-badge" data-badge="cost"></span>
    </a>
    <a class="rail-item" href="#/skills" data-nav="skills">
      <svg class="ico" aria-hidden="true"><use href="#i-skills"/></svg>
      <span class="rail-label">Skill 矩阵</span>
      <span class="rail-badge" data-badge="skills"></span>
    </a>
    <a class="rail-item" href="#/mcps" data-nav="mcps">
      <svg class="ico" aria-hidden="true"><use href="#i-mcps"/></svg>
      <span class="rail-label">MCP 清单</span>
      <span class="rail-badge" data-badge="mcps"></span>
    </a>
    <div class="rail-foot">
      <span>数据只读 · 密钥脱敏</span>
      <a href="/api" target="_blank" rel="noopener">API</a>
    </div>
  </nav>

  <main id="main" tabindex="-1">
    <section class="view" id="view-overview" data-view="overview" aria-labelledby="title-overview">
      <div class="view-head">
        <div>
          <h1 id="title-overview">总览</h1>
          <p class="view-sub" data-sub="overview">正在汇总本机 agent、skill、MCP 与用量</p>
        </div>
      </div>
      <div class="view-body" data-root="overview">
        <div class="sk-grid">
          <div class="sk sk-card"></div><div class="sk sk-card"></div><div class="sk sk-card"></div>
          <div class="sk sk-panel"></div>
        </div>
      </div>
    </section>

    <section class="view" id="view-cost" data-view="cost" aria-labelledby="title-cost" hidden>
      <div class="view-head">
        <div>
          <h1 id="title-cost">模型开销</h1>
          <p class="view-sub" data-sub="cost">按模型拆分 token 与成本，并与平台账单交叉校验</p>
        </div>
      </div>
      <div class="view-body" data-root="cost"></div>
    </section>

    <section class="view" id="view-skills" data-view="skills" aria-labelledby="title-skills" hidden>
      <div class="view-head">
        <div>
          <h1 id="title-skills">Skill 矩阵</h1>
          <p class="view-sub" data-sub="skills">同一 skill 在各平台的安装情况一览</p>
        </div>
      </div>
      <div class="view-body" data-root="skills"></div>
    </section>

    <section class="view" id="view-mcps" data-view="mcps" aria-labelledby="title-mcps" hidden>
      <div class="view-head">
        <div>
          <h1 id="title-mcps">MCP 清单</h1>
          <p class="view-sub" data-sub="mcps">本地安装的 MCP server 及其连接方式、工具与脱敏后的环境变量</p>
        </div>
      </div>
      <div class="view-body" data-root="mcps"></div>
    </section>

    <footer class="foot">
      <span>数据来源：本机配置与日志文件的只读扫描</span>
      <span class="foot-sep">·</span>
      <span>密钥只显示末 4 位</span>
      <span class="foot-sep">·</span>
      <a href="/api" target="_blank" rel="noopener">查看 API</a>
    </footer>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script src="app.js" type="module"></script>
</body>
</html>
